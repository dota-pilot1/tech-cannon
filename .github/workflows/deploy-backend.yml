name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "parantier-api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        working-directory: parantier-api
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: parantier-api
        run: ./gradlew build -x test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        run: |
          scp parantier-api/build/libs/parantier-api-0.0.1-SNAPSHOT.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/parantier-api-0.0.1-SNAPSHOT.jar

      - name: Write application.yml to EC2
        # Heredoc에 싱글쿼트('EOF')를 쓰면 쉘이 변수를 확장하지 않아
        # ${{ secrets.XXX }} 값이 주입되지 않는 버그가 있음.
        # 따라서 로컬에서 파일을 생성한 뒤 scp로 전송하는 방식으로 변경.
        run: |
          cat > /tmp/application.yml << EOF
          spring:
            datasource:
              url: jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
              username: ${{ secrets.DB_USERNAME }}
              password: ${{ secrets.DB_PASSWORD }}
              driver-class-name: org.postgresql.Driver
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false

          server:
            port: 8080

          mybatis:
            mapper-locations: classpath:mybatis/mapper/**/*.xml
            type-aliases-package: com.mapo.palantier
            configuration:
              map-underscore-to-camel-case: true
              default-fetch-size: 100
              default-statement-timeout: 30

          jwt:
            secret: ${{ secrets.JWT_SECRET }}
            access-token-expiration: 3600000
            refresh-token-expiration: 604800000

          aws:
            s3:
              bucket-name: ${{ secrets.AWS_S3_BUCKET_NAME_BACKEND }}
              region: ap-northeast-2
              access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          openai:
            api-key: ${{ secrets.OPENAI_API_KEY }}
            model: gpt-4o

          github:
            token: ${{ secrets.GITHUB_TOKEN }}

          cors:
            allowed-origins:
              - https://dxline-tallent.com
              - https://d1841s1y3ps0cj.cloudfront.net
              - http://localhost:5173
          EOF

          scp /tmp/application.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/application.yml

      - name: Install and restart systemd service
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'ENDSSH'
            LOG=/home/ubuntu/app.log

            sudo tee /etc/systemd/system/palantier-backend.service > /dev/null << 'SERVICE'
          [Unit]
          Description=Palantier Backend API
          Wants=network-online.target
          After=network-online.target postgresql.service

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu
          ExecStart=/usr/bin/java -jar /home/ubuntu/parantier-api-0.0.1-SNAPSHOT.jar --spring.config.location=file:/home/ubuntu/application.yml --spring.profiles.active=prod
          SuccessExitStatus=143
          Restart=always
          RestartSec=10
          StandardOutput=append:/home/ubuntu/app.log
          StandardError=append:/home/ubuntu/app.log

          [Install]
          WantedBy=multi-user.target
          SERVICE

            sudo systemctl daemon-reload
            sudo systemctl enable palantier-backend.service
            sudo systemctl restart palantier-backend.service

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "✅ Application started successfully"
                exit 0
              fi
              sleep 3
            done

            echo "❌ Application failed to become healthy"
            sudo systemctl status palantier-backend.service --no-pager || true
            sudo journalctl -u palantier-backend.service -n 120 --no-pager || true
            tail -120 "$LOG" || true
            exit 1
          ENDSSH

      - name: Deployment complete
        run: |
          echo "✅ Backend deployed successfully to EC2!"
          echo "🖥️  Host: ${{ secrets.EC2_HOST }}"
          echo "🔗 Health check: https://api.dxline-tallent.com/actuator/health"
