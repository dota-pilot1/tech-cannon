name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "parantier-api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        working-directory: parantier-api
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: parantier-api
        run: ./gradlew build -x test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Stop running application
        continue-on-error: true
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "pkill -f 'parantier-api' || kill \$(cat /home/${{ secrets.EC2_USER }}/app.pid 2>/dev/null) || true; sleep 2"

      - name: Upload JAR to EC2
        run: |
          scp parantier-api/build/libs/parantier-api-0.0.1-SNAPSHOT.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/parantier-api-0.0.1-SNAPSHOT.jar

      - name: Write application.yml to EC2
        # Heredoc에 싱글쿼트('EOF')를 쓰면 쉘이 변수를 확장하지 않아
        # ${{ secrets.XXX }} 값이 주입되지 않는 버그가 있음.
        # 따라서 로컬에서 파일을 생성한 뒤 scp로 전송하는 방식으로 변경.
        run: |
          cat > /tmp/application.yml << EOF
          spring:
            datasource:
              url: jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
              username: ${{ secrets.DB_USERNAME }}
              password: ${{ secrets.DB_PASSWORD }}
              driver-class-name: org.postgresql.Driver
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false

          server:
            port: 8080

          jwt:
            secret: ${{ secrets.JWT_SECRET }}
            access-token-expiration: 3600000
            refresh-token-expiration: 604800000

          aws:
            s3:
              bucket-name: ${{ secrets.AWS_S3_BUCKET_NAME_BACKEND }}
              region: ap-northeast-2
              access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          cors:
            allowed-origins:
              - https://dxline-tallent.com
              - https://d1841s1y3ps0cj.cloudfront.net
              - http://localhost:5173
          EOF

          scp /tmp/application.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/application.yml

      - name: Start application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'ENDSSH'
            JAR=/home/ubuntu/parantier-api-0.0.1-SNAPSHOT.jar
            CONFIG=/home/ubuntu/application.yml
            LOG=/home/ubuntu/app.log
            PID_FILE=/home/ubuntu/app.pid

            # 기존 프로세스 종료 (PID 파일 우선, 없으면 pkill)
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")
              kill "$OLD_PID" 2>/dev/null || true
              rm -f "$PID_FILE"
            fi
            pkill -f 'parantier-api' || true
            sleep 3

            # 애플리케이션 시작
            nohup java -jar "$JAR" \
              --spring.config.location="$CONFIG" \
              --spring.profiles.active=prod \
              > "$LOG" 2>&1 &

            echo $! > "$PID_FILE"
            echo "PID: $(cat $PID_FILE)"

            # 시작 대기
            sleep 20

            # 헬스체크
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ Application started successfully"
            else
              echo "❌ Application failed to start"
              tail -80 "$LOG"
              exit 1
            fi
          ENDSSH

      - name: Deployment complete
        run: |
          echo "✅ Backend deployed successfully to EC2!"
          echo "🖥️  Host: ${{ secrets.EC2_HOST }}"
          echo "🔗 Health check: https://api.dxline-tallent.com/actuator/health"
