spring:
  application:
    name: parantier-api

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    time-zone: UTC

  # Active Profile (default: local)
  profiles:
    active: local

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/palantier
    username: palantier_user
    password: palantier_password
    driver-class-name: org.postgresql.Driver

# MyBatis Configuration
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mybatis/mapper/**/*.xml
  type-aliases-package: com.mapo.palantier

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# JWT Configuration
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough
  access-token-expiration: 86400000 # 24시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# AWS S3 Configuration
aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket-name: ${AWS_S3_BUCKET_NAME:hibot-docu}
    region: ${AWS_S3_REGION:ap-northeast-2}
